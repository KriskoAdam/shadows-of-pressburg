<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111820"><title>SHADOWS OF PRESSBURG</title></head><body style="margin:0;background:#101820;color:#eee"><div id="boot" style="font:16px system-ui;padding:24px">Načítavam SHADOWS OF PRESSBURG…</div><script>(async()=>{try{const urls=['./src/game-part1.txt','./src/game-part2.txt','./src/game-part3.txt'];let b64='';for(const u of urls){const r=await fetch(u);if(!r.ok)throw Error('Nepodarilo sa načítať '+u);b64+=(await r.text()).trim()}const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('Prehliadač nepodporuje gzip dekompresiu.');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const code=await new Response(stream).text();document.getElementById('boot').remove();(0,eval)(code)}catch(e){document.getElementById('boot').textContent='Chyba pri načítaní hry: '+e.message}})();</script></body></html>
